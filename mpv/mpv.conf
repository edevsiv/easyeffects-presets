# MPV example configuration
# Copy to ~/.config/mpv/mpv.conf and adjust.

# Prefer PipeWire (falls back depending on build)
ao=pipewire

# Stereo fold-down for headphones / typical PC speakers
audio-channels=stereo

# Keep processing light here — EasyEffects handles EQ/dynamics
# volume=100
# af=lavfi=[loudnorm=I=-16:TP=-1.5:LRA=11]

# Useful OSD while tuning presets
osd-level=1
# audio-display=attachment

# Optional: slightly softer on laptop speakers (uncomment if needed)
# volume=85
